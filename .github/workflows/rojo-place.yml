name: Rojo place artifact

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-place:
    name: Build and upload Roblox place
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install pinned Rojo 7.7.1
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/rojo-7.7.1-linux-x86_64.zip"
          destination="$RUNNER_TEMP/rojo-unpacked"
          binary_dir="$RUNNER_TEMP/rojo-bin"
          curl --fail --location --silent --show-error \
            https://github.com/rojo-rbx/rojo/releases/download/v7.7.1/rojo-7.7.1-linux-x86_64.zip \
            --output "$archive"
          echo "00feb4fa0829a1dd72b49df2639da519a352bfe13cadcd83969e2ba2bb5693c4  $archive" | sha256sum --check
          mkdir -p "$destination" "$binary_dir"
          unzip -q "$archive" -d "$destination"
          rojo_binary="$(find "$destination" -type f -name rojo -print -quit)"
          test -n "$rojo_binary"
          install -m 0755 "$rojo_binary" "$binary_dir/rojo"
          echo "$binary_dir" >> "$GITHUB_PATH"
          "$binary_dir/rojo" --version

      - name: Build place file
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/civitas-world-blockout.rbxlx"
          rojo build default.project.json -o "$output"
          test -s "$output"
          sha256sum "$output"
          echo "Rojo 7.7.1 built the place successfully." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload .rbxlx artifact
        uses: actions/upload-artifact@v4
        with:
          name: civitas-world-blockout-${{ github.sha }}
          path: ${{ runner.temp }}/civitas-world-blockout.rbxlx
          if-no-files-found: error
          retention-days: 30
